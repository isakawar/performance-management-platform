name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pmp
          POSTGRES_PASSWORD: pmp_dev_password
          POSTGRES_DB: pmp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://pmp:pmp_dev_password@localhost:5432/pmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --workspaces --if-present
      - run: npm run build --workspaces --if-present
      - run: npm run test --workspaces --if-present
      - run: npm run test:e2e --workspaces --if-present
